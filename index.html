<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elephant Bookstore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!--===== Issue 1: Header ===== -->
<header style="display: flex;">
    <div>
        <img class="logo" src="imgs/elephantBookstoreLogo.jpg" alt="Elephant Bookstore Logo">
    </div>

    <nav>
        <a href="#">Home</a>
        <a hefr="#">Categories</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- Issue 2: Search Bar -->

<section class="search-section">
    <input type="text" class="search-input" id="searchInput" placeholder="Search for a book...">
    <button class="search-button" onclick="searchBooks()">Search</button>
</section>
<div id="results"></div>

<!--- Issue 3: Used Book Sale and Categories-->

<section class="books-container">
  <!-- Used Book Sale -->
  <div class="used-books">
    <img class="banner" src="imgs/usedBookSaleBanner.png" alt="Used Book Sale Banner">
    <h2>Used Book Sale</h2>
    <div class="books-row">
      <div class="book">
        <img src="imgs/Twilight.jpg" alt="Twilight">
        <p>Twilight</p>
      </div>
      <div class="book">
        <img src="imgs/The Hunger Games.jpg" alt="The Hunger Games">
        <p>The Hunger Games</p>
      </div>
      <div class="book">
        <img src="imgs/The Notebook.jpg" alt="The Notebook">
        <p>The Notebook</p>
      </div>
    </div>
  </div>

  <!-- Categories -->
  <div class="categories">
    <h2>Browse by Categories</h2>
    <ul>
      <li>Fiction</li>
      <li>Non-Fiction</li>
      <li>Romance</li>
      <li>Mystery</li>
    </ul>
    <p class="category-description">
      Discover your next favorite book from our curated categories!
    </p>
    <img src="imgs/Books.jpg" alt="Stack of books" class="category-image">
  </div>
</section>
</body>
</html>
